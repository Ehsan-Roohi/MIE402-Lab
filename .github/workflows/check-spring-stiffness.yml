name: Check spring stiffness analysis
on:
  push:
    paths:
      - 'site/docs/Run_Lab4_Spring_Stiffness.m'
      - 'site/docs/Lab4_Spring_Stiffness_Analysis.m'
      - 'tests/test_lab4_spring_stiffness.m'
      - '.github/workflows/check-spring-stiffness.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  octave:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Install GNU Octave for independent execution
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends octave gnuplot-nox fonts-freefont-otf ghostscript
      - name: Execute formula, fitting, CSV and rejection tests
        run: octave --no-gui --quiet tests/test_lab4_spring_stiffness.m
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: synthetic-spring-analysis-checks
          path: /tmp/lab4_spring_checks/
