name: Check Lab 6 MATLAB
on:
  push:
    paths:
      - 'site/docs/*Lab6*.m'
      - 'tests/test_lab6.m'
      - '.github/workflows/check-lab6.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  matlab:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: matlab-actions/setup-matlab@v3
        with:
          release: R2024b
      - uses: matlab-actions/run-command@v3
        with:
          command: run('tests/test_lab6.m')
