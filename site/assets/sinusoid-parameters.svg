<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="430" viewBox="0 0 1000 430" role="img" aria-labelledby="title desc"><title id="title">Physical meaning of sinusoid parameters</title><desc id="desc">A sine wave with arrows marking amplitude and period, followed by definitions of amplitude, frequency, and phase.</desc><rect width="1000" height="430" fill="white"/><line x1="55" y1="210" x2="610" y2="210" stroke="#555" stroke-width="2"/><line x1="55" y1="35" x2="55" y2="365" stroke="#555" stroke-width="2"/><path d="M55 130 C100 5 145 5 190 130 S280 255 325 130 S415 5 460 130 S550 255 595 130" fill="none" stroke="#286bb0" stroke-width="5"/><line x1="102" y1="210" x2="102" y2="40" stroke="#881c1c" stroke-width="3"/><path d="M95 53 L102 38 L109 53 M95 197 L102 212 L109 197" fill="none" stroke="#881c1c" stroke-width="3"/><text x="120" y="110" font-family="Segoe UI,Arial" font-size="25" fill="#881c1c">amplitude A₁</text><line x1="145" y1="338" x2="325" y2="338" stroke="#881c1c" stroke-width="3"/><path d="M160 330 L144 338 L160 346 M310 330 L326 338 L310 346" fill="none" stroke="#881c1c" stroke-width="3"/><text x="185" y="325" font-family="Segoe UI,Arial" font-size="25" fill="#881c1c">period T₁</text><text x="445" y="245" font-family="Segoe UI,Arial" font-size="22" fill="#333">time</text><text transform="translate(25 250) rotate(-90)" font-family="Segoe UI,Arial" font-size="22" fill="#333">voltage</text><text x="650" y="70" font-family="Segoe UI,Arial" font-size="27" font-weight="700" fill="#881c1c">A₁ = 1.20 V</text><text x="650" y="105" font-family="Segoe UI,Arial" font-size="22" fill="#222">peak voltage from zero</text><text x="650" y="175" font-family="Segoe UI,Arial" font-size="27" font-weight="700" fill="#881c1c">f₁ = 18 Hz</text><text x="650" y="210" font-family="Segoe UI,Arial" font-size="22" fill="#222">18 cycles each second</text><text x="650" y="245" font-family="Segoe UI,Arial" font-size="22" fill="#222">T₁ = 1/f₁ = 55.6 ms</text><text x="650" y="315" font-family="Segoe UI,Arial" font-size="27" font-weight="700" fill="#881c1c">φ₁ = 25°</text><text x="650" y="350" font-family="Segoe UI,Arial" font-size="22" fill="#222">starting position of the cycle</text><text x="80" y="405" font-family="Cambria Math,serif" font-size="28" font-weight="700" fill="#881c1c">x₁(t) = A₁ sin(2πf₁t + φ₁)</text></svg>